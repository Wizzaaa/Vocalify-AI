name: Build Vocalify AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Vocalify project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/vocalify_ai/pubspec.yaml

      - name: Generate Android platform
        working-directory: extracted/vocalify_ai
        run: flutter create . --org com.vocalify --platforms=android

      - name: Set minimum Android SDK
        working-directory: extracted/vocalify_ai
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle
          fi

      - name: Install dependencies
        working-directory: extracted/vocalify_ai
        run: flutter pub get

      - name: Build release APK
        working-directory: extracted/vocalify_ai
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vocalify-AI-APK
          path: extracted/vocalify_ai/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
